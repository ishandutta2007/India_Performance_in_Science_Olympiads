<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933">
        <animate attributeName="stop-color" values="#FF9933;#138808;#000080;#FF9933" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#FF9933;#138808;#FFFFFF" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#138808">
        <animate attributeName="stop-color" values="#138808;#000080;#FF9933;#138808" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bgGradient)" rx="15" ry="15" />
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#000080" text-anchor="middle" dominant-baseline="middle">
    India's Performance in Science Olympiads
  </text>
  <circle cx="100" cy="150" r="10" fill="#000080">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="50" r="10" fill="#000080">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
